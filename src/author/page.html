<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>session-kit — editor</title>
  <style>
    :root {
      --bg: #161412;
      --bg-2: #211e1b;
      --card: #2a2622;
      --line: #3c3732;
      --text: #f4eee6;
      --muted: #b4a89a;
      --accent: #d4a574;
      --danger: #c45c4a;
      --ok: #6fa37a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 ui-sans-serif, system-ui, sans-serif; }
    header.app {
      position: sticky; top: 0; z-index: 5;
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
      padding: 12px 20px; background: #120f0e; border-bottom: 1px solid var(--line);
    }
    header.app .brand { font-weight: 700; letter-spacing: .02em; }
    header.app .path { color: var(--muted); font-size: 12px; word-break: break-all; }
    header.app .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    button {
      appearance: none; border: 1px solid var(--line); background: var(--card); color: var(--text);
      padding: 8px 12px; border-radius: 8px; cursor: pointer; font: inherit;
    }
    button.primary { background: var(--accent); color: #1a140e; border-color: transparent; font-weight: 650; }
    button.ghost { background: transparent; }
    button.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
    button:hover { filter: brightness(1.08); }
    button:disabled { opacity: .45; cursor: not-allowed; filter: none; }
    #banner { margin: 12px 20px 0; padding: 10px 14px; border-radius: 8px; display: none; white-space: pre-wrap; }
    #banner.ok { display: block; background: #1e3324; color: #c8e6cc; }
    #banner.err { display: block; background: #3a1e1a; color: #f0c4bc; }
    #banner.warn { display: block; background: #3a3018; color: #ead7a8; }
    main { max-width: 980px; margin: 0 auto; padding: 16px 20px 80px; }
    .hint { color: var(--muted); margin: 0 0 16px; }
    .new-box {
      background: var(--bg-2); border: 1px dashed var(--accent); border-radius: 12px;
      padding: 14px; margin-bottom: 18px;
    }
    .session {
      background: var(--bg-2); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 8px;
    }
    .session.is-locked { border-color: #3a342e; }
    .session-head {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between;
      padding: 12px 14px; cursor: pointer;
    }
    .session-head .who { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
    .session-head strong { font-size: 16px; }
    .session-head .meta { color: var(--muted); font-size: 12px; }
    .badge {
      font-size: 11px; letter-spacing: .04em; text-transform: uppercase;
      border: 1px solid var(--line); border-radius: 999px; padding: 3px 8px; color: var(--muted);
    }
    .badge.lock { color: #ead7a8; border-color: #6a5a38; }
    .badge.edit { color: #c8e6cc; border-color: #3d6b58; }
    .session-body { padding: 0 14px 16px; }
    .session-sep {
      height: 1px; background: linear-gradient(90deg, transparent, var(--line), transparent);
      margin: 18px 8px;
    }
    .steps { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 14px; }
    .steps button {
      padding: 5px 10px; font-size: 12px; border-radius: 999px;
    }
    .steps button.active { background: var(--accent); color: #1a140e; border-color: transparent; }
    .step {
      border: 1px solid var(--line); border-radius: 12px; padding: 4px 12px 12px; background: #1b1815;
    }
    .step > summary {
      cursor: pointer; font-weight: 650; padding: 12px 4px; list-style: none;
      display: flex; align-items: center; gap: 10px;
    }
    .step > summary::-webkit-details-marker { display: none; }
    .step-n {
      width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
      font-size: 12px; background: var(--card); border: 1px solid var(--line); color: var(--accent);
    }
    .step .count { color: var(--muted); font-weight: 500; margin-left: auto; }
    .inner-sep {
      border: 0; border-top: 1px dashed var(--line); margin: 14px 0;
    }
    .inner-label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; margin: 0 0 8px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
    .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .field.wide { grid-column: 1 / -1; }
    .field span { color: var(--muted); font-size: 12px; }
    input, select, textarea {
      width: 100%; background: #141210; color: var(--text); border: 1px solid var(--line);
      border-radius: 8px; padding: 8px 10px; font: inherit;
    }
    textarea { min-height: 88px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
    .item {
      background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin-top: 10px; padding: 0 10px 10px;
    }
    .item > summary {
      cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 8px; align-items: center;
      padding: 10px 0;
    }
    .item > summary::-webkit-details-marker { display: none; }
    .item-head strong { font-size: 13px; color: var(--accent); }
    .item-head .tools { display: flex; gap: 6px; flex-wrap: wrap; }
    .item-head .tools button { padding: 4px 8px; font-size: 12px; }
    .check { display: flex; align-items: center; gap: 8px; color: var(--muted); padding-top: 18px; }
    .check input { width: auto; }
    .add { margin-top: 10px; }
    .nested { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
    .session.is-locked input, .session.is-locked select, .session.is-locked textarea {
      opacity: .85;
    }
  </style>
</head>
<body>
  <header class="app">
    <div>
      <div class="brand">session-kit</div>
      <div class="path" id="file-path">carregando…</div>
    </div>
    <div class="actions">
      <button type="button" id="btn-new" class="ghost">Nova sessão</button>
      <button type="button" class="ghost" id="btn-quit">Encerrar</button>
    </div>
  </header>
  <div id="banner"></div>
  <main id="app"></main>
  <script>
    (() => {
      const app = document.getElementById('app');
      const banner = document.getElementById('banner');
      const pathEl = document.getElementById('file-path');
      const STEPS = [
        { id: 'identidade', label: 'Identidade' },
        { id: 'cenas', label: 'Cenas' },
        { id: 'wiki', label: 'Wiki' },
        { id: 'pessoas', label: 'Pessoas' },
        { id: 'missoes', label: 'Missões' },
        { id: 'terminal', label: 'Terminal' },
        { id: 'handouts', label: 'Handouts' },
        { id: 'lancer', label: 'Lancer' },
      ];
      const GENRES = ['fantasy', 'cosmic-horror', 'sci-fi', 'modern', 'post-apocalyptic', 'generic'];
      const ENTRY_TYPES = ['lore', 'npcs', 'characters', 'events', 'maps'];
      const QUEST_STATUS = ['ativa', 'pausada', 'parcial', 'concluida', 'falhou'];
      const TREATMENTS = ['text', 'color', 'image', 'crt'];
      const VARIANTS = ['', 'typewriter', 'scroll', 'terminal', 'sacred', 'auto'];
      const HANDOUTS = ['letter', 'poster', 'dataslate', 'plate', 'telegram', 'dossier', 'edict', 'newspaper', 'ticket'];
      const ABILS = ['str', 'dex', 'con', 'int', 'wis', 'cha'];
      let mode = 'single';
      let showNew = false;
      let sessions = [];
      let campaigns = [];
      let systems = [];

      function esc(s) {
        return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      }
      function show(kind, text) {
        banner.className = kind;
        banner.textContent = text;
      }
      function get(obj, path) {
        return path.split('.').reduce((a, k) => (a == null ? a : a[k]), obj);
      }
      function set(obj, path, value) {
        const parts = path.split('.');
        let cur = obj;
        for (let i = 0; i < parts.length - 1; i++) {
          const p = parts[i];
          const next = parts[i + 1];
          if (cur[p] == null) cur[p] = /^\d+$/.test(next) ? [] : {};
          cur = cur[p];
        }
        const last = parts[parts.length - 1];
        if (value === undefined) delete cur[last];
        else cur[last] = value;
      }
      function slugify(input) {
        return String(input || '').normalize('NFD').replace(/\p{M}/gu, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
      }
      function field(kit, si, label, path, opts = {}) {
        const t = opts.type || 'text';
        const raw = get(kit, path);
        const extra = opts.wide ? ' wide' : '';
        const dis = sessions[si].locked ? ' disabled' : '';
        const siAttr = `data-si="${si}" data-path="${esc(path)}"`;
        if (t === 'textarea') {
          const data = opts.lines ? 'lines' : opts.tags ? 'tags' : 'string';
          const shown = opts.lines ? (raw || []).join('\n') : opts.tags ? (raw || []).join(', ') : (raw ?? '');
          return `<label class="field${extra}"><span>${esc(label)}</span><textarea ${siAttr} data-type="${data}" rows="${opts.rows || 5}"${dis}>${esc(shown)}</textarea></label>`;
        }
        if (t === 'select') {
          const v = raw ?? '';
          const empty = opts.optional ? '<option value="">—</option>' : '';
          const optsHtml = (opts.options || []).map((o) => {
            const value = typeof o === 'string' ? o : o.value;
            const lab = typeof o === 'string' ? o : o.label;
            return `<option value="${esc(value)}" ${value === v ? 'selected' : ''}>${esc(lab || '—')}</option>`;
          }).join('');
          return `<label class="field${extra}"><span>${esc(label)}</span><select ${siAttr}${dis}>${empty}${optsHtml}</select></label>`;
        }
        if (t === 'check') {
          return `<label class="check"><input type="checkbox" ${siAttr} data-type="bool"${raw ? ' checked' : ''}${dis}> ${esc(label)}</label>`;
        }
        const n = t === 'number' ? 'number' : 'string';
        return `<label class="field${extra}"><span>${esc(label)}</span><input type="${t}" ${siAttr} data-type="${n}" value="${esc(raw ?? '')}"${dis}></label>`;
      }
      function tools(si, kind, i) {
        if (sessions[si].locked) return '';
        return `<div class="tools">
          <button type="button" data-act="up" data-si="${si}" data-kind="${kind}" data-i="${i}">↑</button>
          <button type="button" data-act="down" data-si="${si}" data-kind="${kind}" data-i="${i}">↓</button>
          <button type="button" class="danger" data-act="remove" data-si="${si}" data-kind="${kind}" data-i="${i}">Remover</button>
        </div>`;
      }
      function addBtn(si, kind, label) {
        if (sessions[si].locked) return '';
        return `<button type="button" class="add" data-act="add" data-si="${si}" data-kind="${kind}">${esc(label)}</button>`;
      }
      function itemOpen(s, key) { return s.itemOpen[key] ? ' open' : ''; }
      function stepOpen(s, id) { return s.stepsOpen[id] ? ' open' : ''; }
      function treatmentFields(kit, si, prefix) {
        const kind = get(kit, prefix + '.kind') || 'text';
        let extra = '';
        if (kind === 'text') {
          extra = field(kit, si, 'Texto', prefix + '.text', { type: 'textarea', rows: 6, wide: true }) +
            field(kit, si, 'Variante', prefix + '.variant', { type: 'select', options: VARIANTS, optional: true });
        } else if (kind === 'color') {
          extra = field(kit, si, 'Cor', prefix + '.color', { type: 'color' }) + field(kit, si, 'Rótulo', prefix + '.label');
        } else if (kind === 'image') {
          extra = field(kit, si, 'Arquivo / URL', prefix + '.src') + field(kit, si, 'Alt', prefix + '.alt');
        } else if (kind === 'crt') {
          extra = field(kit, si, 'Tema CRT', prefix + '.theme', { type: 'select', options: ['phosphor', 'amber', 'ice'], optional: true }) +
            field(kit, si, 'Linhas', prefix + '.lines', { type: 'textarea', lines: true, rows: 6, wide: true });
        }
        return `<div class="grid">${field(kit, si, 'Tratamento', prefix + '.kind', { type: 'select', options: TREATMENTS })}</div><div class="grid">${extra}</div>`;
      }
      function wrapItem(s, si, key, title, inner, kind, i) {
        return `<details class="item" data-si="${si}" data-item="${esc(key)}"${itemOpen(s, key)}>
          <summary class="item-head"><strong>${esc(title)}</strong>${tools(si, kind, i)}</summary>
          ${inner}
        </details>`;
      }
      function wrapStep(s, si, step, count, inner) {
        const n = STEPS.findIndex((x) => x.id === step.id) + 1;
        return `<details class="step" id="step-${si}-${step.id}" data-si="${si}" data-step="${step.id}"${stepOpen(s, step.id)}>
          <summary><span class="step-n">${n}</span> ${esc(step.label)}${count != null ? `<span class="count">${count}</span>` : ''}</summary>
          ${inner}
        </details>`;
      }
      function systemOptions(current) {
        const opts = systems.map((s) => ({ value: s.id, label: s.label }));
        if (current && !systems.some((s) => s.id === current)) {
          opts.unshift({ value: current, label: current });
        }
        return opts;
      }
      function campaignOptions(selected) {
        return campaigns.map((c) => {
          const extra = c.system ? ' · ' + (systems.find((s) => s.id === c.system)?.label || c.system) : '';
          return `<option value="${esc(c.dir)}" ${c.dir === selected ? 'selected' : ''}>${esc(c.name + extra)}</option>`;
        }).join('');
      }
      function sessionBody(s, si) {
        const kit = s.kit;
        const F = (label, path, opts) => field(kit, si, label, path, opts);
        const scenes = kit.scenes || [];
        const entries = kit.entries || [];
        const parties = kit.parties || [];
        const party = kit.party || [];
        const quests = kit.quests || [];
        const handouts = kit.handouts || [];
        const lancerEvents = (kit.lancer && kit.lancer.events) || [];
        const cmds = Object.entries((kit.terminal && kit.terminal.commands) || {});
        const files = (kit.terminal && kit.terminal.files) || [];
        const pills = STEPS.map((st, n) =>
          `<button type="button" data-act="goto-step" data-si="${si}" data-step="${st.id}" class="${s.stepsOpen[st.id] ? 'active' : ''}">${n + 1} ${esc(st.label)}</button>`
        ).join('');

        const campPick = s.locked || campaigns.length === 0 ? '' : `<div class="grid">
            <label class="field wide"><span>Preencher de uma campanha existente</span>
              <select data-apply-campaign="${si}">
                <option value="">—</option>
                ${campaignOptions('')}
              </select>
            </label>
          </div>`;
        const identidade = `
          <p class="inner-label">Sessão</p>
          <div class="grid">
            ${F('ID', 'id')}${F('Título', 'title')}${F('Sistema', 'system', { type: 'select', options: systemOptions(kit.system), optional: true })}
            ${F('Gênero', 'genre', { type: 'select', options: GENRES, optional: true })}
            ${F('Data', 'date')}${F('Local', 'location')}
            ${F('Ano da era', 'era.startYear', { type: 'number'})}${F('Rótulo da era', 'era.label')}
          </div>
          <hr class="inner-sep">
          <p class="inner-label">Campanha</p>
          ${campPick}
          <div class="grid">
            ${F('ID', 'campaign.id')}${F('Nome', 'campaign.name')}${F('Tema', 'campaign.theme')}
            ${F('Emoji', 'campaign.emoji')}${F('Ordem', 'campaign.order', { type: 'number' })}
            ${F('Resumo', 'campaign.summary', { type: 'textarea', rows: 3, wide: true })}
          </div>`;

        const cenas = scenes.map((sc, i) => wrapItem(s, si, 'scenes.' + i, sc.name || sc.id || ('Cena ' + (i + 1)),
          `<div class="grid">${F('ID', 'scenes.' + i + '.id')}${F('Nome', 'scenes.' + i + '.name')}</div>${treatmentFields(kit, si, 'scenes.' + i + '.treatment')}`,
          'scenes', i)).join('') + addBtn(si, 'scenes', '+ Cena');

        const wiki = entries.map((sc, i) => wrapItem(s, si, 'entries.' + i, sc.title || ('Entrada ' + (i + 1)),
          `<div class="grid">
            ${F('Tipo', 'entries.' + i + '.type', { type: 'select', options: ENTRY_TYPES })}
            ${F('Slug', 'entries.' + i + '.slug')}${F('Título', 'entries.' + i + '.title')}
            ${F('Emoji', 'entries.' + i + '.emoji')}${F('Status', 'entries.' + i + '.status')}
            ${F('Papel', 'entries.' + i + '.role')}${F('Facção', 'entries.' + i + '.faction')}
            ${F('Local', 'entries.' + i + '.location')}${F('Data', 'entries.' + i + '.date')}
            ${F('Ordem', 'entries.' + i + '.order', { type: 'number' })}
            ${F('Tags (vírgula)', 'entries.' + i + '.tags', { tags: true })}
            ${F('Resumo', 'entries.' + i + '.summary', { type: 'textarea', rows: 2, wide: true })}
            ${F('Texto', 'entries.' + i + '.body', { type: 'textarea', rows: 6, wide: true })}
          </div>`, 'entries', i)).join('') + addBtn(si, 'entries', '+ Entrada');

        const pessoas = parties.map((sc, i) => wrapItem(s, si, 'parties.' + i, 'Grupo · ' + (sc.name || sc.id || String(i + 1)),
          `<div class="grid">${F('ID', 'parties.' + i + '.id')}${F('Nome', 'parties.' + i + '.name')}</div>`,
          'parties', i)).join('') + addBtn(si, 'parties', '+ Grupo') +
          party.map((sc, i) => wrapItem(s, si, 'party.' + i, sc.name || ('Personagem ' + (i + 1)),
            `<div class="grid">
              ${F('ID', 'party.' + i + '.id')}${F('Nome', 'party.' + i + '.name')}${F('Raça', 'party.' + i + '.race')}
              ${F('Nível', 'party.' + i + '.level', { type: 'number' })}${F('Grupo (partyId)', 'party.' + i + '.partyId')}
              ${F('Jogador', 'party.' + i + '.player')}
              ${F('Origem', 'party.' + i + '.source', { type: 'select', options: ['ddb', 'manual'], optional: true })}
              ${F('HP', 'party.' + i + '.hp', { type: 'number' })}${F('HP máx', 'party.' + i + '.maxHp', { type: 'number' })}
              ${F('CA', 'party.' + i + '.ac', { type: 'number' })}
              ${ABILS.map((a) => F(a.toUpperCase(), 'party.' + i + '.abilities.' + a, { type: 'number' })).join('')}
              ${F('História', 'party.' + i + '.backstory', { type: 'textarea', rows: 3, wide: true })}
            </div>
            <div class="nested">
              <span style="color:var(--muted);font-size:12px">Classes</span>
              ${(sc.classes || []).map((c, j) => `
                <div class="grid" style="margin-top:8px">
                  ${F('Classe', 'party.' + i + '.classes.' + j + '.name')}
                  ${F('Nível', 'party.' + i + '.classes.' + j + '.level', { type: 'number' })}
                  ${F('Subclasse', 'party.' + i + '.classes.' + j + '.subclass')}
                  ${s.locked ? '' : `<div class="check"><button type="button" class="danger" data-act="remove-class" data-si="${si}" data-i="${i}" data-j="${j}">Remover classe</button></div>`}
                </div>`).join('')}
              ${s.locked ? '' : `<button type="button" class="add" data-act="add-class" data-si="${si}" data-i="${i}">+ Classe</button>`}
            </div>`, 'party', i)).join('') + addBtn(si, 'party', '+ Personagem');

        const missoes = `
          <div class="grid">
            ${F('Tipo do briefing', 'briefing.kind', { type: 'select', options: ['guild', 'lancer'], optional: true })}
            ${F('Nome da guilda / esquadrão', 'briefing.guildName')}
            ${F('Título de boot', 'briefing.bootTitle')}
            ${F('Brasão', 'briefing.crest', { type: 'select', options: ['fleur', 'd20'], optional: true })}
          </div>
          <hr class="inner-sep">` +
          quests.map((sc, i) => wrapItem(s, si, 'quests.' + i, sc.title || ('Missão ' + (i + 1)),
            `<div class="grid">
              ${F('ID', 'quests.' + i + '.id')}${F('Título', 'quests.' + i + '.title')}
              ${F('Status', 'quests.' + i + '.status', { type: 'select', options: QUEST_STATUS, optional: true })}
              ${F('Grupo', 'quests.' + i + '.partyId')}${F('Recompensa', 'quests.' + i + '.reward')}
              ${F('Objetivo', 'quests.' + i + '.objective', { type: 'textarea', rows: 3, wide: true })}
              ${F('Notas', 'quests.' + i + '.notes', { type: 'textarea', rows: 2, wide: true })}
              ${F('Guilda', 'quests.' + i + '.guild.name')}${F('Lema', 'quests.' + i + '.guild.motto')}
              ${F('Signatário', 'quests.' + i + '.guild.signer')}${F('Papel', 'quests.' + i + '.guild.role')}
              ${F('Glifo', 'quests.' + i + '.guild.glyph')}
            </div>`, 'quests', i)).join('') + addBtn(si, 'quests', '+ Missão');

        const terminal = `
          <div class="grid">
            ${F('Tema', 'terminal.theme')}${F('ID', 'terminal.id')}${F('Nome', 'terminal.name')}
            ${F('Cabeçalho', 'terminal.header')}
            ${F('MOTD (uma linha por linha)', 'terminal.motd', { type: 'textarea', lines: true, rows: 6, wide: true })}
          </div>
          <hr class="inner-sep">
          <p class="inner-label">Comandos</p>` +
          cmds.map(([name], i) => wrapItem(s, si, 'cmd.' + i, 'Comando · ' + name,
            `<div class="grid">
              <label class="field"><span>Nome</span><input data-act="cmd-name" data-si="${si}" data-i="${i}" value="${esc(name)}"${s.locked ? ' disabled' : ''}></label>
              ${F('Resposta (linhas)', 'terminal.commands.' + name, { type: 'textarea', lines: true, rows: 5, wide: true })}
            </div>`, 'cmds', i)).join('') +
          (s.locked ? '' : `<button type="button" class="add" data-act="add-cmd" data-si="${si}">+ Comando</button>`) +
          `<hr class="inner-sep"><p class="inner-label">Arquivos</p>` +
          files.map((sc, i) => wrapItem(s, si, 'tfiles.' + i, 'Arquivo · ' + (sc.path || String(i + 1)),
            `<div class="grid">
              ${F('Caminho', 'terminal.files.' + i + '.path')}${F('Senha', 'terminal.files.' + i + '.password')}
              ${F('DC do crack', 'terminal.files.' + i + '.crackDC', { type: 'number' })}
              ${F('Conteúdo', 'terminal.files.' + i + '.content', { type: 'textarea', rows: 6, wide: true })}
              ${F('Travado', 'terminal.files.' + i + '.locked', { type: 'check' })}
              ${F('Crackável', 'terminal.files.' + i + '.crackable', { type: 'check' })}
              ${F('Jogo de decrypt', 'terminal.files.' + i + '.decryptGame', { type: 'check' })}
              ${F('Tracer', 'terminal.files.' + i + '.tracer', { type: 'check' })}
            </div>`, 'tfiles', i)).join('') +
          (s.locked ? '' : `<button type="button" class="add" data-act="add-file" data-si="${si}">+ Arquivo</button>`);

        const hand = handouts.map((sc, i) => wrapItem(s, si, 'handouts.' + i, sc.title || sc.slug || ('Handout ' + (i + 1)),
          `<div class="grid">
            ${F('Modelo', 'handouts.' + i + '.template', { type: 'select', options: HANDOUTS })}
            ${F('Slug', 'handouts.' + i + '.slug')}${F('Título', 'handouts.' + i + '.title')}
            ${F('Tamanho', 'handouts.' + i + '.size', { type: 'select', options: ['a5', 'a6'], optional: true })}
            ${F('De', 'handouts.' + i + '.from')}${F('Para', 'handouts.' + i + '.to')}
            ${F('Data', 'handouts.' + i + '.date')}${F('Selo', 'handouts.' + i + '.seal')}
            ${F('Sobrancelha', 'handouts.' + i + '.eyebrow')}${F('QR', 'handouts.' + i + '.qr')}
            ${F('Corpo', 'handouts.' + i + '.body', { type: 'textarea', rows: 7, wide: true })}
          </div>`, 'handouts', i)).join('') + addBtn(si, 'handouts', '+ Handout');

        const lancer = `
          <div class="grid">
            ${F('Slug da missão', 'lancer.mission.slug')}${F('Nome', 'lancer.mission.name')}
            ${F('Status', 'lancer.mission.status')}
            ${F('Texto (markdown)', 'lancer.mission.body', { type: 'textarea', rows: 10, wide: true })}
          </div>
          <hr class="inner-sep">` +
          lancerEvents.map((sc, i) => wrapItem(s, si, 'levents.' + i, 'Evento · ' + (sc.name || sc.slug || String(i + 1)),
            `<div class="grid">
              ${F('Slug', 'lancer.events.' + i + '.slug')}${F('Nome', 'lancer.events.' + i + '.name')}
              ${F('Status', 'lancer.events.' + i + '.status')}
              ${F('Texto', 'lancer.events.' + i + '.body', { type: 'textarea', rows: 8, wide: true })}
            </div>`, 'levents', i)).join('') +
          (s.locked ? '' : `<button type="button" class="add" data-act="add-levent" data-si="${si}">+ Evento Lancer</button>`);

        const blocks = [
          wrapStep(s, si, STEPS[0], null, identidade),
          wrapStep(s, si, STEPS[1], scenes.length, cenas),
          wrapStep(s, si, STEPS[2], entries.length, wiki),
          wrapStep(s, si, STEPS[3], party.length, pessoas),
          wrapStep(s, si, STEPS[4], quests.length, missoes),
          wrapStep(s, si, STEPS[5], files.length, terminal),
          wrapStep(s, si, STEPS[6], handouts.length, hand),
          wrapStep(s, si, STEPS[7], lancerEvents.length, lancer),
        ].join('<div class="session-sep"></div>');

        return `<div class="session-body">
          <nav class="steps">${pills}</nav>
          ${s.locked ? '' : `<div class="actions" style="display:flex;gap:8px;margin-bottom:12px">
            <button type="button" data-act="save" data-si="${si}">Salvar YAML</button>
            <button type="button" class="primary" data-act="compile" data-si="${si}">Salvar e compilar</button>
            <button type="button" class="ghost" data-act="lock" data-si="${si}">Travar</button>
          </div>`}
          ${blocks}
        </div>`;
      }
      function hydrate(raw) {
        return {
          rel: raw.rel,
          path: raw.path,
          kit: raw.kit || {},
          warning: raw.warning,
          locked: raw.existed !== false && !raw.startUnlocked,
          open: !!raw.startUnlocked,
          stepsOpen: { identidade: true },
          itemOpen: {},
        };
      }
      function render() {
        const defaultCamp = campaigns[0] ? campaigns[0].dir : '';
        const defaultSys = campaigns[0] && campaigns[0].system ? campaigns[0].system : '';
        const newBox = !showNew || mode === 'single' ? '' : `<section class="new-box">
          <p class="inner-label">Nova sessão</p>
          <div class="grid">
            <label class="field"><span>Campanha</span>
              <select id="new-camp">
                ${campaignOptions(defaultCamp)}
                <option value="" ${defaultCamp ? '' : 'selected'}>Nova campanha…</option>
              </select>
            </label>
            <label class="field" id="new-camp-name-wrap"${defaultCamp ? ' hidden' : ''}>
              <span>Nome da campanha</span>
              <input id="new-camp-name" placeholder="Crônicas de Mirrus">
            </label>
            <label class="field"><span>Encontro</span><input id="new-enc" placeholder="o-comeco-do-fim"></label>
            <label class="field"><span>Sistema</span>
              <select id="new-sys">
                <option value="">—</option>
                ${systemOptions(defaultSys).map((o) => `<option value="${esc(o.value)}" ${o.value === defaultSys ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}
              </select>
            </label>
          </div>
          <button type="button" class="primary add" data-act="create-kit">Criar e editar</button>
        </section>`;
        const groups = [];
        const seen = new Map();
        sessions.forEach((s, si) => {
          const camp = (s.kit.campaign && (s.kit.campaign.name || s.kit.campaign.id)) || 'Sem campanha';
          if (!seen.has(camp)) {
            seen.set(camp, groups.length);
            groups.push({ name: camp, indices: [] });
          }
          groups[seen.get(camp)].indices.push(si);
        });
        const cards = groups.map((g) => {
          const items = g.indices.map((si) => {
            const s = sessions[si];
            const kit = s.kit;
            const title = kit.title || kit.id || s.rel;
            const sys = kit.system ? systems.find((x) => x.id === kit.system)?.label || kit.system : '';
            return `<article class="session ${s.locked ? 'is-locked' : ''} ${s.open ? 'is-open' : ''}" data-si="${si}">
              <div class="session-head" data-act="toggle-session" data-si="${si}">
                <div class="who">
                  <strong>${esc(title)}</strong>
                  <span class="meta">${esc([sys, s.rel].filter(Boolean).join(' · '))}</span>
                </div>
                <span class="badge ${s.locked ? 'lock' : 'edit'}">${s.locked ? 'Travada' : 'Editando'}</span>
                ${s.locked
                  ? `<button type="button" class="primary" data-act="unlock" data-si="${si}">Editar</button>`
                  : ''}
              </div>
              ${s.open ? sessionBody(s, si) : ''}
            </article>`;
          }).join('');
          const head = mode === 'catalog' && groups.length > 1
            ? `<p class="inner-label">${esc(g.name)}</p>`
            : '';
          return head + items;
        }).join('<div class="session-sep"></div>');
        app.innerHTML = `<p class="hint">Sessões antigas ficam travadas até você apertar Editar. Nova sessão lista as campanhas e sistemas já usados nesta pasta.</p>${newBox}${cards || '<p class="hint">Nenhum kit.yaml neste diretório.</p>'}`;
        bind();
      }
      function bind() {
        app.querySelectorAll('[data-path]').forEach((el) => {
          el.addEventListener('input', onInput);
          el.addEventListener('change', onInput);
        });
        app.querySelectorAll('[data-act]').forEach((el) => {
          el.addEventListener('click', onAct);
        });
        app.querySelectorAll('details[data-step], details[data-item]').forEach((el) => {
          el.addEventListener('toggle', () => {
            const si = Number(el.dataset.si);
            const s = sessions[si];
            if (!s) return;
            if (el.dataset.step) s.stepsOpen[el.dataset.step] = el.open;
            if (el.dataset.item) s.itemOpen[el.dataset.item] = el.open;
          });
        });
        const campSel = document.getElementById('new-camp');
        if (campSel) {
          campSel.addEventListener('change', () => {
            const wrap = document.getElementById('new-camp-name-wrap');
            const sys = document.getElementById('new-sys');
            if (wrap) wrap.hidden = !!campSel.value;
            const camp = campaigns.find((c) => c.dir === campSel.value);
            if (sys) sys.value = camp && camp.system ? camp.system : '';
          });
        }
        app.querySelectorAll('[data-apply-campaign]').forEach((el) => {
          el.addEventListener('change', () => {
            const s = sessions[Number(el.dataset.applyCampaign)];
            const camp = campaigns.find((c) => c.dir === el.value);
            if (!s || s.locked || !camp) return;
            s.kit.campaign = { id: camp.id, name: camp.name };
            if (camp.theme) s.kit.campaign.theme = camp.theme;
            if (camp.emoji) s.kit.campaign.emoji = camp.emoji;
            if (camp.summary) s.kit.campaign.summary = camp.summary;
            if (camp.order != null) s.kit.campaign.order = camp.order;
            if (camp.system) s.kit.system = camp.system;
            if (camp.genre) s.kit.genre = camp.genre;
            const y = window.scrollY;
            render();
            window.scrollTo(0, y);
          });
        });
      }
      function kitOf(el) {
        const si = Number(el.dataset.si);
        return sessions[si] ? sessions[si].kit : null;
      }
      function onInput(e) {
        const el = e.target;
        const s = sessions[Number(el.dataset.si)];
        if (!s || s.locked) return;
        const kit = s.kit;
        const path = el.dataset.path;
        if (!path) return;
        const type = el.dataset.type || 'string';
        let value;
        if (type === 'bool') value = el.checked;
        else if (type === 'number') value = el.value === '' ? undefined : Number(el.value);
        else if (type === 'tags') value = el.value.split(',').map((x) => x.trim()).filter(Boolean);
        else if (type === 'lines') value = el.value.split('\n');
        else value = el.value;
        if (path.endsWith('.treatment.kind')) {
          const prefix = path.slice(0, -5);
          if (value === 'text') set(kit, prefix, { kind: 'text', text: '' });
          else if (value === 'color') set(kit, prefix, { kind: 'color', color: '#222222' });
          else if (value === 'image') set(kit, prefix, { kind: 'image', src: '' });
          else if (value === 'crt') set(kit, prefix, { kind: 'crt', lines: [] });
          const y = window.scrollY;
          render();
          window.scrollTo(0, y);
          return;
        }
        set(kit, path, value);
        if (path === 'title' && !kit.id) kit.id = slugify(value);
        if (path === 'campaign.name' && kit.campaign && !kit.campaign.id) kit.campaign.id = slugify(value);
      }
      function move(arr, i, dir) {
        const j = i + dir;
        if (!arr || j < 0 || j >= arr.length) return;
        const [item] = arr.splice(i, 1);
        arr.splice(j, 0, item);
      }
      function ensureArr(kit, key) {
        if (!Array.isArray(kit[key])) kit[key] = [];
        return kit[key];
      }
      async function api(method, url, body) {
        const res = await fetch(url, {
          method,
          headers: body ? { 'content-type': 'application/json' } : undefined,
          body: body ? JSON.stringify(body) : undefined,
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
        return data;
      }
      async function onAct(e) {
        e.stopPropagation();
        e.preventDefault();
        const btn = e.currentTarget;
        const act = btn.dataset.act;
        const si = Number(btn.dataset.si);
        const s = sessions[si];
        const y = window.scrollY;
        if (act === 'toggle-session') {
          if (s) s.open = !s.open;
        } else if (act === 'unlock') {
          if (s) { s.locked = false; s.open = true; s.stepsOpen.identidade = true; }
        } else if (act === 'lock') {
          if (s) s.locked = true;
        } else if (act === 'goto-step') {
          if (!s) return;
          s.open = true;
          s.stepsOpen[btn.dataset.step] = true;
          render();
          window.scrollTo(0, y);
          const el = document.getElementById('step-' + si + '-' + btn.dataset.step);
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
          return;
        } else if (act === 'save' || act === 'compile') {
          if (!s || s.locked) return;
          try {
            const url = act === 'save' ? '/api/kit' : '/api/compile';
            const method = act === 'save' ? 'PUT' : 'POST';
            const data = await api(method, url, { kit: s.kit, rel: s.rel });
            s.kit = data.kit;
            s.locked = true;
            const extra = data.files ? '\n' + data.files.join('\n') : '';
            show('ok', (act === 'save' ? 'Salvo em ' : 'Salvo e compilado em ') + (data.out || data.path) + extra);
          } catch (err) { show('err', err.message); return; }
        } else if (act === 'create-kit') {
          const campDir = document.getElementById('new-camp').value;
          const enc = slugify(document.getElementById('new-enc').value);
          const sys = document.getElementById('new-sys').value;
          if (!enc) { show('err', 'Encontro é obrigatório.'); return; }
          const body = {};
          if (sys) body.system = sys;
          if (campDir) {
            body.dir = campDir + '/' + enc;
          } else {
            const name = (document.getElementById('new-camp-name').value || '').trim();
            if (!name) { show('err', 'Nome da campanha é obrigatório.'); return; }
            const slug = slugify(name);
            if (!slug) { show('err', 'Nome da campanha inválido.'); return; }
            body.dir = slug + '/' + enc;
            body.campaignName = name;
          }
          try {
            const data = await api('POST', '/api/kits', body);
            const created = hydrate(data.session);
            created.locked = false;
            created.open = true;
            sessions.push(created);
            if (created.kit && created.kit.campaign) {
              const dir = body.dir.split('/')[0];
              if (!campaigns.some((c) => c.dir === dir)) {
                campaigns.push({
                  dir,
                  id: created.kit.campaign.id,
                  name: created.kit.campaign.name,
                  system: created.kit.system,
                  genre: created.kit.genre,
                });
                campaigns.sort((a, b) => a.name.localeCompare(b.name, 'pt'));
              }
            }
            showNew = false;
            show('ok', 'Criada ' + created.rel);
          } catch (err) { show('err', err.message); return; }
        } else if (act === 'cmd-name') {
          return;
        } else if (!s || s.locked) {
          render();
          window.scrollTo(0, y);
          return;
        } else {
          const kit = s.kit;
          const kind = btn.dataset.kind;
          const i = Number(btn.dataset.i);
          if (act === 'add') {
            const defaults = {
              scenes: () => ({ id: '', name: '', treatment: { kind: 'text', text: '' } }),
              entries: () => ({ type: 'lore', title: '', body: '' }),
              parties: () => ({ id: '', name: '' }),
              party: () => ({ id: '', name: '', classes: [] }),
              quests: () => ({ id: '', title: '', status: 'ativa' }),
              handouts: () => ({ template: 'letter', slug: '', title: '', body: '' }),
            };
            ensureArr(kit, kind).push(defaults[kind]());
          } else if (act === 'remove') {
            if (kind === 'tfiles') (kit.terminal && kit.terminal.files || []).splice(i, 1);
            else if (kind === 'levents') (kit.lancer && kit.lancer.events || []).splice(i, 1);
            else if (kind === 'cmds') {
              const names = Object.keys((kit.terminal && kit.terminal.commands) || {});
              if (names[i]) delete kit.terminal.commands[names[i]];
            } else ensureArr(kit, kind).splice(i, 1);
          } else if (act === 'up' || act === 'down') {
            const dir = act === 'up' ? -1 : 1;
            if (kind === 'cmds') return;
            if (kind === 'tfiles') move(kit.terminal.files || [], i, dir);
            else if (kind === 'levents') move((kit.lancer && kit.lancer.events) || [], i, dir);
            else move(ensureArr(kit, kind), i, dir);
          } else if (act === 'add-class') {
            const ch = (kit.party || [])[i];
            if (ch) { if (!ch.classes) ch.classes = []; ch.classes.push({ name: '', level: 1 }); }
          } else if (act === 'remove-class') {
            const ch = (kit.party || [])[i];
            const j = Number(btn.dataset.j);
            if (ch && ch.classes) ch.classes.splice(j, 1);
          } else if (act === 'add-cmd') {
            if (!kit.terminal) kit.terminal = { theme: 'ibm', id: 'terminal', name: 'Terminal', files: [] };
            if (!kit.terminal.commands) kit.terminal.commands = {};
            let n = 'comando', k = 1;
            while (kit.terminal.commands[n]) { k += 1; n = 'comando-' + k; }
            kit.terminal.commands[n] = [''];
          } else if (act === 'add-file') {
            if (!kit.terminal) kit.terminal = { theme: 'ibm', id: 'terminal', name: 'Terminal', files: [] };
            if (!kit.terminal.files) kit.terminal.files = [];
            kit.terminal.files.push({ path: 'notes.md', content: '' });
          } else if (act === 'add-levent') {
            if (!kit.lancer) kit.lancer = {};
            if (!kit.lancer.events) kit.lancer.events = [];
            kit.lancer.events.push({ slug: '', name: '', body: '' });
          }
        }
        render();
        window.scrollTo(0, y);
      }
      app.addEventListener('change', (e) => {
        const el = e.target;
        if (!el.dataset || el.dataset.act !== 'cmd-name') return;
        const s = sessions[Number(el.dataset.si)];
        if (!s || s.locked) return;
        const i = Number(el.dataset.i);
        const names = Object.keys((s.kit.terminal && s.kit.terminal.commands) || {});
        const oldName = names[i];
        const next = slugify(el.value) || el.value.trim();
        if (!oldName || !next || next === oldName) return;
        s.kit.terminal.commands[next] = s.kit.terminal.commands[oldName];
        delete s.kit.terminal.commands[oldName];
        const y = window.scrollY;
        render();
        window.scrollTo(0, y);
      });
      document.getElementById('btn-new').addEventListener('click', () => {
        if (mode === 'single') {
          show('warn', 'Aberto num arquivo só. Rode session-kit edit kits/ para o catálogo.');
          return;
        }
        showNew = !showNew;
        render();
      });
      document.getElementById('btn-quit').addEventListener('click', async () => {
        try { await api('POST', '/api/shutdown'); } catch (_) {}
        show('ok', 'Editor encerrado. Pode fechar esta aba.');
      });
      fetch('/api/workspace').then((r) => r.json()).then((data) => {
        mode = data.mode || 'single';
        pathEl.textContent = data.root || '';
        sessions = (data.sessions || []).map(hydrate);
        campaigns = data.campaigns || [];
        systems = data.systems || [];
        const warns = sessions.filter((s) => s.warning);
        if (warns.length) show('warn', warns.map((s) => s.rel + ': ' + s.warning).join('\n'));
        document.getElementById('btn-new').hidden = mode === 'single';
        render();
      }).catch((err) => show('err', err.message));
    })();
  </script>
</body>
</html>
