<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>session-kit — editor</title>
  <style>
    :root {
      --bg: #161412;
      --bg-2: #211e1b;
      --card: #2a2622;
      --line: #3c3732;
      --text: #f4eee6;
      --muted: #b4a89a;
      --accent: #d4a574;
      --danger: #c45c4a;
      --ok: #6fa37a;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.45 ui-sans-serif, system-ui, sans-serif; }
    body { display: flex; flex-direction: column; height: 100dvh; }
    header.app {
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
      padding: 10px 20px; background: #120f0e; border-bottom: 1px solid var(--line);
    }
    header.app .brand { font-weight: 700; letter-spacing: .02em; }
    header.app .path { color: var(--muted); font-size: 12px; word-break: break-all; }
    header.app .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    button {
      appearance: none; border: 1px solid var(--line); background: var(--card); color: var(--text);
      padding: 8px 12px; border-radius: 8px; cursor: pointer; font: inherit;
    }
    button.primary { background: var(--accent); color: #1a140e; border-color: transparent; font-weight: 650; }
    button.ghost { background: transparent; }
    button.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
    button:hover { filter: brightness(1.08); }
    button:disabled { opacity: .45; cursor: not-allowed; filter: none; }
    #banner { margin: 10px 20px 0; padding: 10px 14px; border-radius: 8px; display: none; white-space: pre-wrap; }
    #banner.ok { display: block; background: #1e3324; color: #c8e6cc; }
    #banner.err { display: block; background: #3a1e1a; color: #f0c4bc; }
    #banner.warn { display: block; background: #3a3018; color: #ead7a8; }
    .hint, .field-hint { color: var(--muted); margin: 0 0 12px; font-size: 13px; }
    .kicker { margin: 0; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); }

    /* Menu à esquerda + palco, como no opord. */
    #app {
      position: relative; flex: 1; min-height: 0;
      display: grid; grid-template-columns: var(--desk-w, 460px) minmax(0, 1fr);
    }
    #app.is-collapsed { grid-template-columns: minmax(0, 1fr); }
    .desk {
      min-width: 0; min-height: 0; overflow: auto; padding: 16px 18px 24px;
      background: var(--bg-2); border-right: 1px solid var(--line);
    }
    .desk-resizer {
      position: absolute; top: 0; bottom: 0; left: calc(var(--desk-w, 460px) - 4px); width: 8px;
      cursor: col-resize; z-index: 6; touch-action: none;
    }
    .desk-resizer:hover, .desk-resizer:focus-visible {
      outline: none;
      background: linear-gradient(90deg, transparent 3px, var(--accent) 3px, var(--accent) 5px, transparent 5px);
    }
    .desk-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
    .desk-head h1 { margin: 2px 0 0; font-size: 20px; }
    .desk-collapse { flex: none; padding: 4px 10px; font-size: 13px; }
    .camp-label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .1em; margin: 14px 0 6px; }
    .sess {
      display: flex; gap: 10px; align-items: center; width: 100%; text-align: left;
      padding: 10px 12px; margin-top: 6px; background: var(--card); border-radius: 10px;
    }
    .sess.active { border-color: var(--accent); }
    .sess .who { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
    .sess strong { font-size: 14px; }
    .sess .meta { color: var(--muted); font-size: 12px; word-break: break-all; }
    .badge {
      font-size: 11px; letter-spacing: .04em; text-transform: uppercase;
      border: 1px solid var(--line); border-radius: 999px; padding: 3px 8px; color: var(--muted); flex: none;
    }
    .badge.lock { color: #ead7a8; border-color: #6a5a38; }
    .badge.edit { color: #c8e6cc; border-color: #3d6b58; }
    .steps { list-style: none; margin: 6px 0 4px 14px; padding: 0 0 0 10px; border-left: 1px solid var(--line); }
    .steps button {
      display: flex; gap: 10px; align-items: baseline; width: 100%; text-align: left;
      background: transparent; border-color: transparent; padding: 6px 8px; border-radius: 8px;
    }
    .steps button.active { background: var(--card); border-color: var(--line); }
    .steps button.active .step-title { color: var(--accent); }
    .steps .step-title { font-weight: 650; font-size: 14px; }
    .steps .step-sub { display: block; color: var(--muted); font-size: 12px; font-weight: 400; }
    .steps .count { margin-left: auto; color: var(--muted); font-size: 12px; }

    .stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .stage-scroll { flex: 1; min-height: 0; overflow: auto; padding: 18px 24px 24px; }
    .stage-inner { max-width: 920px; }
    .stage-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; justify-content: space-between; margin-bottom: 10px; }
    .stage-head h2 { margin: 2px 0 4px; font-size: 22px; }
    .stage-head .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .desk-expand { margin-bottom: 12px; }
    .lock-bar {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between;
      padding: 8px 12px; margin-bottom: 12px; border: 1px solid #6a5a38; border-radius: 10px; color: #ead7a8; background: #241f16;
    }
    .stage-nav {
      display: flex; justify-content: space-between; gap: 8px; padding: 10px 24px 14px;
      border-top: 1px solid var(--line); background: var(--bg);
    }
    .stage-nav button { max-width: 50%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .new-box {
      background: var(--bg-2); border: 1px dashed var(--accent); border-radius: 12px;
      padding: 14px; margin-bottom: 18px;
    }

    /* Blocos: começam fechados, com uma linha do que há dentro. */
    details.block { border-top: 1px solid var(--line); }
    details.block:last-of-type { border-bottom: 1px solid var(--line); }
    details.block > summary {
      cursor: pointer; list-style: none; display: flex; gap: 10px; align-items: center; padding: 10px 0 10px 18px; position: relative;
    }
    details.block > summary::-webkit-details-marker { display: none; }
    details.block > summary::before { content: '▸'; position: absolute; left: 0; top: 11px; color: var(--muted); }
    details.block[open] > summary::before { content: '▾'; color: var(--accent); }
    .block-head { display: flex; flex-direction: column; min-width: 0; flex: 1; }
    .block-head strong { font-size: 14px; color: var(--accent); }
    .block-sub { color: var(--muted); font-size: 12px; }
    .block-body { padding: 0 0 14px 18px; }
    .tools { display: flex; gap: 6px; flex-wrap: wrap; }
    .tools button { padding: 4px 8px; font-size: 12px; }
    .inner-label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; margin: 16px 0 6px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
    .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .field.wide { grid-column: 1 / -1; }
    .field span { color: var(--muted); font-size: 12px; }
    input, select, textarea {
      width: 100%; background: #141210; color: var(--text); border: 1px solid var(--line);
      border-radius: 8px; padding: 8px 10px; font: inherit;
    }
    textarea { min-height: 88px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
    .check { display: flex; align-items: center; gap: 8px; color: var(--muted); padding-top: 18px; }
    .check input { width: auto; }
    .add { margin-top: 10px; }
    .nested { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
    .is-locked input, .is-locked select, .is-locked textarea { opacity: .85; }

    @media (max-width: 760px) {
      body { height: auto; min-height: 100dvh; }
      #app, #app.is-collapsed { grid-template-columns: minmax(0, 1fr); }
      .desk { overflow: visible; border-right: 0; border-bottom: 1px solid var(--line); }
      .desk-resizer { display: none; }
      .stage-scroll { overflow: visible; padding: 16px; }
      .stage-nav { padding: 10px 16px 14px; }
    }
  </style>
</head>
<body>
  <header class="app">
    <div>
      <div class="brand">session-kit</div>
      <div class="path" id="file-path">carregando…</div>
    </div>
    <div class="actions">
      <button type="button" id="btn-new" class="ghost">Nova sessão</button>
      <button type="button" class="ghost" id="btn-quit">Encerrar</button>
    </div>
  </header>
  <div id="banner"></div>
  <div id="app"></div>
  <script>
    (() => {
      const app = document.getElementById('app');
      const banner = document.getElementById('banner');
      const pathEl = document.getElementById('file-path');
      const STEPS = [
        { id: 'geral', label: '⚙ Geral', sub: 'Sessão e campanha', hint: 'O que vale para a sessão inteira.' },
        { id: 'cenas', label: 'Cenas', sub: 'Telas do /display', hint: 'Uma tela por cena: texto, cor, imagem ou CRT.' },
        { id: 'wiki', label: 'Wiki', sub: 'Entradas do códice', hint: 'Lore, NPCs, eventos e mapas da campanha.' },
        { id: 'pessoas', label: 'Pessoas', sub: 'Grupos e personagens', hint: 'Grupos e as fichas de quem joga.' },
        { id: 'missoes', label: 'Missões', sub: 'Briefing e missões', hint: 'O cabeçalho do briefing e cada missão.' },
        { id: 'terminal', label: 'Terminal', sub: 'Tema, comandos e arquivos', hint: 'O terminal do ITR: tela, comandos e arquivos.' },
        { id: 'handouts', label: 'Handouts', sub: 'Props impressos', hint: 'Cartas, cartazes e fichas para imprimir.' },
        { id: 'lancer', label: 'Lancer', sub: 'Missão e eventos', hint: 'Missão e eventos do lancer-briefings.' },
      ];
      const KIND_LABEL = { text: 'texto', color: 'cor', image: 'imagem', crt: 'CRT' };
      const WIDTH_KEY = 'session-kit.desk.width';
      const COLLAPSED_KEY = 'session-kit.desk.collapsed';
      const MIN_W = 320;
      const DEFAULT_W = 460;
      const GENRES = ['fantasy', 'cosmic-horror', 'sci-fi', 'modern', 'post-apocalyptic', 'generic'];
      const ENTRY_TYPES = ['lore', 'npcs', 'characters', 'events', 'maps'];
      const QUEST_STATUS = ['ativa', 'pausada', 'parcial', 'concluida', 'falhou'];
      const TREATMENTS = ['text', 'color', 'image', 'crt'];
      const VARIANTS = ['', 'typewriter', 'scroll', 'terminal', 'sacred', 'auto'];
      const HANDOUTS = ['letter', 'poster', 'dataslate', 'plate', 'telegram', 'dossier', 'edict', 'newspaper', 'ticket'];
      const ABILS = ['str', 'dex', 'con', 'int', 'wis', 'cha'];
      let mode = 'single';
      let showNew = false;
      let sessions = [];
      let campaigns = [];
      let systems = [];
      let cur = -1;
      let curStep = 'geral';
      let deskW = DEFAULT_W;
      let collapsed = false;
      try {
        const w = Number(localStorage.getItem(WIDTH_KEY));
        if (Number.isFinite(w) && w > 0) deskW = w;
        collapsed = localStorage.getItem(COLLAPSED_KEY) === '1';
      } catch (_) { /* sem armazenamento: menu no padrão */ }
      function store(key, value) {
        try { localStorage.setItem(key, value); } catch (_) { /* sem armazenamento */ }
      }
      function maxW() { return Math.max(MIN_W, Math.round(window.innerWidth * 0.6)); }

      function esc(s) {
        return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      }
      function show(kind, text) {
        banner.className = kind;
        banner.textContent = text;
      }
      function get(obj, path) {
        return path.split('.').reduce((a, k) => (a == null ? a : a[k]), obj);
      }
      function set(obj, path, value) {
        const parts = path.split('.');
        let cur = obj;
        for (let i = 0; i < parts.length - 1; i++) {
          const p = parts[i];
          const next = parts[i + 1];
          if (cur[p] == null) cur[p] = /^\d+$/.test(next) ? [] : {};
          cur = cur[p];
        }
        const last = parts[parts.length - 1];
        if (value === undefined) delete cur[last];
        else cur[last] = value;
      }
      function slugify(input) {
        return String(input || '').normalize('NFD').replace(/\p{M}/gu, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
      }
      function field(kit, si, label, path, opts = {}) {
        const t = opts.type || 'text';
        const raw = get(kit, path);
        const extra = opts.wide ? ' wide' : '';
        const dis = sessions[si].locked ? ' disabled' : '';
        const siAttr = `data-si="${si}" data-path="${esc(path)}"`;
        if (t === 'textarea') {
          const data = opts.lines ? 'lines' : opts.tags ? 'tags' : 'string';
          const shown = opts.lines ? (raw || []).join('\n') : opts.tags ? (raw || []).join(', ') : (raw ?? '');
          return `<label class="field${extra}"><span>${esc(label)}</span><textarea ${siAttr} data-type="${data}" rows="${opts.rows || 5}"${dis}>${esc(shown)}</textarea></label>`;
        }
        if (t === 'select') {
          const v = raw ?? '';
          const empty = opts.optional ? '<option value="">—</option>' : '';
          const optsHtml = (opts.options || []).map((o) => {
            const value = typeof o === 'string' ? o : o.value;
            const lab = typeof o === 'string' ? o : o.label;
            return `<option value="${esc(value)}" ${value === v ? 'selected' : ''}>${esc(lab || '—')}</option>`;
          }).join('');
          return `<label class="field${extra}"><span>${esc(label)}</span><select ${siAttr}${dis}>${empty}${optsHtml}</select></label>`;
        }
        if (t === 'check') {
          return `<label class="check"><input type="checkbox" ${siAttr} data-type="bool"${raw ? ' checked' : ''}${dis}> ${esc(label)}</label>`;
        }
        const n = t === 'number' ? 'number' : 'string';
        return `<label class="field${extra}"><span>${esc(label)}</span><input type="${t}" ${siAttr} data-type="${n}" value="${esc(raw ?? '')}"${dis}></label>`;
      }
      function tools(si, kind, i) {
        if (sessions[si].locked) return '';
        return `<div class="tools">
          <button type="button" data-act="up" data-si="${si}" data-kind="${kind}" data-i="${i}">↑</button>
          <button type="button" data-act="down" data-si="${si}" data-kind="${kind}" data-i="${i}">↓</button>
          <button type="button" class="danger" data-act="remove" data-si="${si}" data-kind="${kind}" data-i="${i}">Remover</button>
        </div>`;
      }
      function addBtn(si, kind, label) {
        if (sessions[si].locked) return '';
        return `<button type="button" class="add" data-act="add" data-si="${si}" data-kind="${kind}">${esc(label)}</button>`;
      }
      function itemOpen(s, key) { return s.itemOpen[key] ? ' open' : ''; }
      function subOf(parts) { return parts.filter((x) => x != null && x !== '').join(' · '); }
      function treatmentFields(kit, si, prefix) {
        const kind = get(kit, prefix + '.kind') || 'text';
        let extra = '';
        if (kind === 'text') {
          extra = field(kit, si, 'Texto', prefix + '.text', { type: 'textarea', rows: 6, wide: true }) +
            field(kit, si, 'Variante', prefix + '.variant', { type: 'select', options: VARIANTS, optional: true });
        } else if (kind === 'color') {
          extra = field(kit, si, 'Cor', prefix + '.color', { type: 'color' }) + field(kit, si, 'Rótulo', prefix + '.label');
        } else if (kind === 'image') {
          extra = field(kit, si, 'Arquivo / URL', prefix + '.src') + field(kit, si, 'Alt', prefix + '.alt');
        } else if (kind === 'crt') {
          extra = field(kit, si, 'Tema CRT', prefix + '.theme', { type: 'select', options: ['phosphor', 'amber', 'ice'], optional: true }) +
            field(kit, si, 'Linhas', prefix + '.lines', { type: 'textarea', lines: true, rows: 6, wide: true });
        }
        return `<div class="grid">${field(kit, si, 'Tratamento', prefix + '.kind', { type: 'select', options: TREATMENTS })}</div><div class="grid">${extra}</div>`;
      }
      // Um bloco do palco. Começa fechado; `sub` diz o que há dentro.
      function block(s, si, key, title, sub, inner, kind, i) {
        return `<details class="block" data-si="${si}" data-item="${esc(key)}"${itemOpen(s, key)}>
          <summary><span class="block-head"><strong>${esc(title)}</strong><span class="block-sub">${esc(sub || '—')}</span></span>${kind ? tools(si, kind, i) : ''}</summary>
          <div class="block-body">${inner}</div>
        </details>`;
      }
      function systemOptions(current) {
        const opts = systems.map((s) => ({ value: s.id, label: s.label }));
        if (current && !systems.some((s) => s.id === current)) {
          opts.unshift({ value: current, label: current });
        }
        return opts;
      }
      function campaignOptions(selected) {
        return campaigns.map((c) => {
          const extra = c.system ? ' · ' + (systems.find((s) => s.id === c.system)?.label || c.system) : '';
          return `<option value="${esc(c.dir)}" ${c.dir === selected ? 'selected' : ''}>${esc(c.name + extra)}</option>`;
        }).join('');
      }
      function stepContent(s, si, step) {
        const kit = s.kit;
        const F = (label, path, opts) => field(kit, si, label, path, opts);
        const scenes = kit.scenes || [];
        const entries = kit.entries || [];
        const parties = kit.parties || [];
        const party = kit.party || [];
        const quests = kit.quests || [];
        const handouts = kit.handouts || [];
        const lancerEvents = (kit.lancer && kit.lancer.events) || [];
        const cmds = Object.entries((kit.terminal && kit.terminal.commands) || {});
        const files = (kit.terminal && kit.terminal.files) || [];
        const campPick = s.locked || campaigns.length === 0 ? '' : `<div class="grid">
            <label class="field wide"><span>Preencher de uma campanha existente</span>
              <select data-apply-campaign="${si}">
                <option value="">—</option>
                ${campaignOptions('')}
              </select>
            </label>
          </div>`;
        const geral = block(s, si, 'geral.sessao', 'Sessão', 'ID, título, sistema, data, local e era', `
          <div class="grid">
            ${F('ID', 'id')}${F('Título', 'title')}${F('Sistema', 'system', { type: 'select', options: systemOptions(kit.system), optional: true })}
            ${F('Gênero', 'genre', { type: 'select', options: GENRES, optional: true })}
            ${F('Data', 'date')}${F('Local', 'location')}
            ${F('Ano da era', 'era.startYear', { type: 'number'})}${F('Rótulo da era', 'era.label')}
          </div>`) + block(s, si, 'geral.campanha', 'Campanha', 'Nome, tema, emoji, ordem e resumo', `
          ${campPick}
          <div class="grid">
            ${F('ID', 'campaign.id')}${F('Nome', 'campaign.name')}${F('Tema', 'campaign.theme')}
            ${F('Emoji', 'campaign.emoji')}${F('Ordem', 'campaign.order', { type: 'number' })}
            ${F('Resumo', 'campaign.summary', { type: 'textarea', rows: 3, wide: true })}
          </div>`);

        const cenas = scenes.map((sc, i) => block(s, si, 'scenes.' + i, sc.name || sc.id || ('Cena ' + (i + 1)),
          subOf([KIND_LABEL[(sc.treatment || {}).kind] || (sc.treatment || {}).kind, (sc.treatment || {}).variant, (sc.treatment || {}).theme, (sc.treatment || {}).label]),
          `<div class="grid">${F('ID', 'scenes.' + i + '.id')}${F('Nome', 'scenes.' + i + '.name')}</div>${treatmentFields(kit, si, 'scenes.' + i + '.treatment')}`,
          'scenes', i)).join('') + addBtn(si, 'scenes', '+ Cena');

        const wiki = entries.map((sc, i) => block(s, si, 'entries.' + i, sc.title || ('Entrada ' + (i + 1)),
          subOf([sc.type, sc.slug, sc.status]),
          `<div class="grid">
            ${F('Tipo', 'entries.' + i + '.type', { type: 'select', options: ENTRY_TYPES })}
            ${F('Slug', 'entries.' + i + '.slug')}${F('Título', 'entries.' + i + '.title')}
            ${F('Emoji', 'entries.' + i + '.emoji')}${F('Status', 'entries.' + i + '.status')}
            ${F('Papel', 'entries.' + i + '.role')}${F('Facção', 'entries.' + i + '.faction')}
            ${F('Local', 'entries.' + i + '.location')}${F('Data', 'entries.' + i + '.date')}
            ${F('Ordem', 'entries.' + i + '.order', { type: 'number' })}
            ${F('Tags (vírgula)', 'entries.' + i + '.tags', { tags: true })}
            ${F('Resumo', 'entries.' + i + '.summary', { type: 'textarea', rows: 2, wide: true })}
            ${F('Texto', 'entries.' + i + '.body', { type: 'textarea', rows: 6, wide: true })}
          </div>`, 'entries', i)).join('') + addBtn(si, 'entries', '+ Entrada');

        const pessoas = `<p class="inner-label">Grupos</p>` + parties.map((sc, i) => block(s, si, 'parties.' + i, 'Grupo · ' + (sc.name || sc.id || String(i + 1)),
          subOf([sc.id, party.filter((c) => c.partyId && c.partyId === sc.id).length + ' personagem(ns)']),
          `<div class="grid">${F('ID', 'parties.' + i + '.id')}${F('Nome', 'parties.' + i + '.name')}</div>`,
          'parties', i)).join('') + addBtn(si, 'parties', '+ Grupo') +
          `<p class="inner-label">Personagens</p>` +
          party.map((sc, i) => block(s, si, 'party.' + i, sc.name || ('Personagem ' + (i + 1)),
            subOf([sc.race, (sc.classes || []).map((c) => c.name).filter(Boolean).join('/'), sc.level != null ? 'nível ' + sc.level : '', sc.player]),
            `<div class="grid">
              ${F('ID', 'party.' + i + '.id')}${F('Nome', 'party.' + i + '.name')}${F('Raça', 'party.' + i + '.race')}
              ${F('Nível', 'party.' + i + '.level', { type: 'number' })}${F('Grupo (partyId)', 'party.' + i + '.partyId')}
              ${F('Jogador', 'party.' + i + '.player')}
              ${F('Origem', 'party.' + i + '.source', { type: 'select', options: ['ddb', 'manual'], optional: true })}
              ${F('HP', 'party.' + i + '.hp', { type: 'number' })}${F('HP máx', 'party.' + i + '.maxHp', { type: 'number' })}
              ${F('CA', 'party.' + i + '.ac', { type: 'number' })}

      // Redesenha sem perder a rolagem do menu e do palco.

      function bindResizer() {

          app.style.setProperty('--desk-w', deskW + 'px');
        };
        handle.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          const left = app.getBoundingClientRect().left;
          handle.setPointerCapture(e.pointerId);
          const move = (ev) => setW(ev.clientX - left);
          const stop = (ev) => {
            handle.releasePointerCapture(ev.pointerId);
            handle.removeEventListener('pointermove', move);
            handle.removeEventListener('pointerup', stop);
            store(WIDTH_KEY, String(deskW));
          };
          handle.addEventListener('pointermove', move);
          handle.addEventListener('pointerup', stop);

        handle.addEventListener('keydown', (e) => {

          store(WIDTH_KEY, String(deskW));

        else if (type === 'number') value = el.value === '' ? undefined : Number(el.value);
        else if (type === 'tags') value = el.value.split(',').map((x) => x.trim()).filter(Boolean);

          else if (value === 'color') set(kit, prefix, { kind: 'color', color: '#222222' });

          return;
        } else {
          const kit = s.kit;
          const kind = btn.dataset.kind;
          const i = Number(btn.dataset.i);
          if (act === 'add') {
            const defaults = {
              scenes: () => ({ id: '', name: '', treatment: { kind: 'text', text: '' } }),
              entries: () => ({ type: 'lore', title: '', body: '' }),
              parties: () => ({ id: '', name: '' }),
              party: () => ({ id: '', name: '', classes: [] }),
              quests: () => ({ id: '', title: '', status: 'ativa' }),
              handouts: () => ({ template: 'letter', slug: '', title: '', body: '' }),
            };
            ensureArr(kit, kind).push(defaults[kind]());
          } else if (act === 'remove') {
            if (kind === 'tfiles') (kit.terminal && kit.terminal.files || []).splice(i, 1);
            else if (kind === 'levents') (kit.lancer && kit.lancer.events || []).splice(i, 1);
            else if (kind === 'cmds') {
              const names = Object.keys((kit.terminal && kit.terminal.commands) || {});
              if (names[i]) delete kit.terminal.commands[names[i]];
            } else ensureArr(kit, kind).splice(i, 1);
          } else if (act === 'up' || act === 'down') {
            const dir = act === 'up' ? -1 : 1;
            if (kind === 'cmds') return;
            if (kind === 'tfiles') move(kit.terminal.files || [], i, dir);
            else if (kind === 'levents') move((kit.lancer && kit.lancer.events) || [], i, dir);
            else move(ensureArr(kit, kind), i, dir);
          } else if (act === 'add-class') {
            const ch = (kit.party || [])[i];
            if (ch) { if (!ch.classes) ch.classes = []; ch.classes.push({ name: '', level: 1 }); }
          } else if (act === 'remove-class') {
            const ch = (kit.party || [])[i];
            const j = Number(btn.dataset.j);
            if (ch && ch.classes) ch.classes.splice(j, 1);
          } else if (act === 'add-cmd') {
            if (!kit.terminal) kit.terminal = { theme: 'ibm', id: 'terminal', name: 'Terminal', files: [] };
            if (!kit.terminal.commands) kit.terminal.commands = {};
            let n = 'comando', k = 1;
            while (kit.terminal.commands[n]) { k += 1; n = 'comando-' + k; }
            kit.terminal.commands[n] = [''];
          } else if (act === 'add-file') {
            if (!kit.terminal) kit.terminal = { theme: 'ibm', id: 'terminal', name: 'Terminal', files: [] };
            if (!kit.terminal.files) kit.terminal.files = [];
            kit.terminal.files.push({ path: 'notes.md', content: '' });
          } else if (act === 'add-levent') {
            if (!kit.lancer) kit.lancer = {};
            if (!kit.lancer.events) kit.lancer.events = [];
            kit.lancer.events.push({ slug: '', name: '', body: '' });
          }
        }
        rerender();
      }
      app.addEventListener('change', (e) => {
        const el = e.target;
        if (!el.dataset || el.dataset.act !== 'cmd-name') return;
        const s = sessions[Number(el.dataset.si)];
        if (!s || s.locked) return;
        const i = Number(el.dataset.i);
        const names = Object.keys((s.kit.terminal && s.kit.terminal.commands) || {});
        const oldName = names[i];
        const next = slugify(el.value) || el.value.trim();
        if (!oldName || !next || next === oldName) return;
        s.kit.terminal.commands[next] = s.kit.terminal.commands[oldName];
        delete s.kit.terminal.commands[oldName];
        rerender();
      });
      document.getElementById('btn-new').addEventListener('click', () => {
        if (mode === 'single') {
          show('warn', 'Aberto num arquivo só. Rode session-kit edit kits/ para o catálogo.');
          return;
        }
        showNew = !showNew;
        rerender(true);
      });
      document.getElementById('btn-quit').addEventListener('click', async () => {
        try { await api('POST', '/api/shutdown'); } catch (_) {}
        show('ok', 'Editor encerrado. Pode fechar esta aba.');
      });
      fetch('/api/workspace').then((r) => r.json()).then((data) => {
        mode = data.mode || 'single';
        pathEl.textContent = data.root || '';
        sessions = (data.sessions || []).map(hydrate);
        const start = sessions.findIndex((s) => s.startUnlocked);
        cur = start >= 0 ? start : sessions.length ? 0 : -1;
        campaigns = data.campaigns || [];
        systems = data.systems || [];
        const warns = sessions.filter((s) => s.warning);
        if (warns.length) show('warn', warns.map((s) => s.rel + ': ' + s.warning).join('\n'));
        document.getElementById('btn-new').hidden = mode === 'single';
        render();
      }).catch((err) => show('err', err.message));
    })();
  </script>
</body>
</html>
