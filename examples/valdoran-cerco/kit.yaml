        No auge do inverno, uma maré de criaturas da Fenda se lançou contra a Muralha de Pedravale. Por uma noite inteira, os Vigias seguraram.

        As tochas verdes da borda se apagaram — sinal de que algo grande vinha.
  - id: tochas-verdes
